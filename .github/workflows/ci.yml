name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short -m "not integration"

    - name: Run tests with coverage
      run: |
        python -m pytest tests/ --cov=. --cov-report=term-missing --cov-fail-under=80 -m "not integration"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check syntax
      run: |
        python -m py_compile process_transcript_full.py
        python -m py_compile test_connection.py
        python -m py_compile load_to_dmcp.py
        python -m py_compile analyze_map.py
        python -m py_compile heal_map.py
